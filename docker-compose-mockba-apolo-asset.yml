services:
  micro-mockba-asset-futures-bot:
    image: andresdom2004/micro-mockba-asset-futures-bot:latest
    container_name: micro-mockba-asset-futures-bot
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data

  # ── Real-time log viewer → http://your-server:8080 ──────────────────
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle-logs
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    environment:
      - DOZZLE_NO_ANALYTICS=true
      - DOZZLE_FILTER=name=micro-mockba-asset-futures-bot
    networks:
      - default
      - nginx-proxy-manager_default

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-apolo-asset
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_LIFECYCLE_HOOKS=true
      - WATCHTOWER_LABEL_ENABLE=true

networks:
  nginx-proxy-manager_default:
    external: true