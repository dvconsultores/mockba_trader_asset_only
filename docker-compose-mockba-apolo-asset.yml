services:
  micro-mockba-asset-futures-bot:
    image: andresdom2004/micro-mockba-asset-futures-bot:latest
    container_name: micro-mockba-asset-futures-bot
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - ./logs:/app/logs

  # ── Sidecar: tails apolo.log into stdout for Dozzle ─────────────────
  log-tail:
    image: alpine:latest
    container_name: log-tail-apolo
    restart: always
    volumes:
      - ./logs:/logs:ro
    command: sh -c "touch /logs/apolo.log && tail -f /logs/apolo.log"
    depends_on:
      - micro-mockba-asset-futures-bot

  # ── Real-time log viewer (browser: http://your-server:8080) ──────────
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle-logs
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    environment:
      - DOZZLE_NO_ANALYTICS=true
      - DOZZLE_FILTER=asset-futures

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-apolo-asset
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_LIFECYCLE_HOOKS=true
      - WATCHTOWER_LABEL_ENABLE=true