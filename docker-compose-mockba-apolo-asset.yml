services:
  micro-mockba-asset-futures-bot:
    image: andresdom2004/micro-mockba-asset-futures-bot:latest
    container_name: micro-mockba-asset-futures-bot
    restart: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - apolo-logs:/app/logs

  # ── Dashboard API (FastAPI) ──────────────────────────────
  dashboard:
    build: ./dashboard
    container_name: mockba-dashboard-api
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data:ro
      - apolo-logs:/app/logs:ro
    environment:
      - DB_PATH=/app/data/trading.db
      - LOG_PATH=/app/logs/apolo.log
      - MODEL_PATH=/app/data/signal_model.json

  # ── Dashboard UI (React + nginx) ─────────────────────────
  dashboard-ui:
    build: ./dashboard-ui
    container_name: mockba-dashboard-ui
    restart: always
    ports:
      - "86:80"
    depends_on:
      - dashboard

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-apolo-asset
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_LIFECYCLE_HOOKS=true
      - WATCHTOWER_LABEL_ENABLE=true

volumes:
  apolo-logs: